# StateTune on OpenROAD-flow-scripts (ORFS) — NanGate45 / AES
# ORFS runs from the extracted openroad/orfs docker image via a bwrap sandbox (no root/docker needed):
#   ${ORFS_HOME}/rootfs    image rootfs (ORFS at /OpenROAD-flow-scripts), installed by tools/setup_orfs.sh
#   tools/orfs-sandbox     wrapper; this repo and $TMPDIR are visible inside at the same path
# Parameter names are ORFS Makefile variables; lower-case aliases (gp_timing_driven, place_padding, ...)
# are mapped to ORFS names by openroad_runner.param_mapping.

project_name: "openroad_aes_ng45"
work_dir: "./runs/openroad_aes_ng45"

eda:
  flow: "openroad"

orfs:
  root: "${ORFS_HOME}/rootfs/OpenROAD-flow-scripts"
  flow_dir: "flow"
  platform: "nangate45"
  exec_prefix: ["./tools/orfs-sandbox"]   # relative to the repo root (launch from there)
  threads: 8                        # per run; keep threads * max_concurrency well below 128 cores
  extra_vars:
    SKIP_INCREMENTAL_REPAIR: 1      # same workaround as ORFS's own nangate45/aes config
    LEC_CHECK: 0                    # formal equivalence checks only verify, don't change QoR; skip to save runtime

tools:
  yosys: "/OpenROAD-flow-scripts/tools/install/yosys/bin/yosys"
  openroad: "/OpenROAD-flow-scripts/tools/install/OpenROAD/bin/openroad"

design:
  name: "aes_cipher_top"
  verilog:
    - "./benchmark/aes/*.v"
  verilog_include_dirs:
    - "./benchmark/aes"
  sdc: "./benchmark/aes/aes_constraint_nangate45.sdc"

default_params:
  CORE_UTILIZATION: 45
  CORE_ASPECT_RATIO: 1.0
  CORE_MARGIN: 2
  PLACE_DENSITY_LB_ADDON: 0.20
  gp_timing_driven: 1
  gp_routability_driven: 1
  place_padding: 0
  TNS_END_PERCENT: 100
  ABC_AREA: 0
  cts_cluster_size: 20
  CTS_CLUSTER_DIAMETER: 100
  ROUTING_LAYER_ADJUSTMENT: 0.5

fidelity:
  quick_target: "cts"
  full_target: "finish"
  quick_effective_params: [
    "CORE_UTILIZATION", "CORE_ASPECT_RATIO", "CORE_MARGIN", "PLACE_DENSITY_LB_ADDON",
    "gp_timing_driven", "gp_routability_driven", "place_padding", "TNS_END_PERCENT",
    "ABC_AREA", "cts_cluster_size", "CTS_CLUSTER_DIAMETER",
  ]
  quick_timeout_sec: 1800
  full_timeout_sec: 3600
  promote_prob: 0.35
  promo_batch: 16
  max_promo_pool: 2000
  stop_starting_sec: 600
  risk_beta: 2.0
  margin_sec: 0
  warmup_quick: 8

llm:
  enable: true
  backend: "online"
  cot_model: "deepseek-flash"
  generation_model: "deepseek-flash"
  temperature: 0.6
  cot_temperature: 0.4
  timeout_sec: 300
  max_output_tokens: 18000
  cot_max_output_tokens: 2000

rag:
  enable: true
  corpus_path: "./third_party/RAG-EDA/benchmark/openroad_documentation.json"
  qa_path: "./third_party/RAG-EDA/benchmark/ORD-QA.jsonl"
  index_path: "./runs/openroad_aes_ng45/rag_index"
  embedding_model: "./third_party/RAG-EDA/MiniLM-L6-v2"
  top_k: 5
  max_context_chars: 4000
  extra_docs: []

ka:
  enable: true
  agent_name: "KA"
  max_candidates_per_call: 8
  persist_rules: true
  min_full_valid_for_hard_rules: 12
  max_active_hard_rules: 8
  hard_rule_trim_interval: 50
  hard_rule_mode: "soft"
  max_active_soft_heuristics: 30
  max_output_tokens: 18000

tuning:
  mode: "full"
  max_concurrency: 4
  total_seconds: 21600
  cleanup_every: 5                 # delete non-Pareto ORFS intermediates often: a shared disk filled up once (2026-10-23)
  use_ehvi: true

  param_space:
    - {name: "CORE_UTILIZATION",         type: "float", range: [30, 55]}
    - {name: "CORE_ASPECT_RATIO",        type: "float", range: [0.80, 1.20]}
    - {name: "CORE_MARGIN",              type: "int",   range: [1, 8]}
    - {name: "PLACE_DENSITY_LB_ADDON",   type: "float", range: [0.02, 0.25]}
    - {name: "gp_timing_driven",         type: "int",   choices: [0, 1]}
    - {name: "gp_routability_driven",    type: "int",   choices: [0, 1]}
    - {name: "place_padding",            type: "int",   range: [0, 1]}
    - {name: "TNS_END_PERCENT",          type: "int",   range: [10, 100]}
    - {name: "ABC_AREA",                 type: "int",   choices: [0, 1]}
    - {name: "cts_cluster_size",         type: "int",   range: [10, 40]}
    - {name: "CTS_CLUSTER_DIAMETER",     type: "int",   range: [50, 150]}
    - {name: "ROUTING_LAYER_ADJUSTMENT", type: "float", range: [0.30, 0.60]}
