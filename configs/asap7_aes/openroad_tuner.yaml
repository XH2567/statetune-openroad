# StateTune on OpenROAD-flow-scripts — asap7_aes
# GENERATED by tools/gen_openroad_configs.py from configs/nangate_aes/openroad_tuner.yaml
# (see that file for comments). Edit the generator/template and re-run instead of editing here.
project_name: openroad_aes_asap7
work_dir: ./runs/openroad_aes_asap7
eda:
  flow: openroad
orfs:
  root: ${ORFS_HOME}/rootfs/OpenROAD-flow-scripts
  flow_dir: flow
  platform: asap7
  exec_prefix:
  - ./tools/orfs-sandbox
  threads: 8
  extra_vars:
    LEC_CHECK: 0
    SKIP_INCREMENTAL_REPAIR: 1
tools:
