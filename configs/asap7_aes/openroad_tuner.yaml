  openroad: /OpenROAD-flow-scripts/tools/install/OpenROAD/bin/openroad
design:
  name: aes_cipher_top
  verilog:
  - ./benchmark/aes/*.v
  verilog_include_dirs:
  - ./benchmark/aes
  sdc: ./benchmark/aes/aes_constraint_asap7.sdc
default_params:
  CORE_UTILIZATION: 60
  CORE_ASPECT_RATIO: 1.0
  CORE_MARGIN: 2
  PLACE_DENSITY_LB_ADDON: 0.2
  gp_timing_driven: 1
  gp_routability_driven: 1
  place_padding: 0
  TNS_END_PERCENT: 100
  ABC_AREA: 0
  cts_cluster_size: 20
  CTS_CLUSTER_DIAMETER: 50
  ROUTING_LAYER_ADJUSTMENT: 0.5
fidelity:
  quick_target: cts
  full_target: finish
  quick_effective_params:
  - CORE_UTILIZATION
  - CORE_ASPECT_RATIO
  - CORE_MARGIN
  - PLACE_DENSITY_LB_ADDON
  - gp_timing_driven
  - gp_routability_driven
  - place_padding
  - TNS_END_PERCENT
  - ABC_AREA
  - cts_cluster_size
  - CTS_CLUSTER_DIAMETER
  quick_timeout_sec: 1800
  full_timeout_sec: 3600
  promote_prob: 0.35
  promo_batch: 16
  max_promo_pool: 2000
  stop_starting_sec: 600
  risk_beta: 2.0
  margin_sec: 0
  warmup_quick: 8
llm:
  enable: true
  backend: online
  cot_model: deepseek-flash
  generation_model: deepseek-flash
  temperature: 0.6
  cot_temperature: 0.4
  timeout_sec: 300
  max_output_tokens: 18000
  cot_max_output_tokens: 2000
rag:
  enable: true
  corpus_path: ./third_party/RAG-EDA/benchmark/openroad_documentation.json
  qa_path: ./third_party/RAG-EDA/benchmark/ORD-QA.jsonl
  index_path: ./runs/openroad_aes_asap7/rag_index
